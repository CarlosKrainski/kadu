    <style>
        :root {
            --bg-primary: #0b0c0e;
            --bg-secondary: #141519;
            --card-bg: #1c1d22;
            --border-color: #2a2b30;
            --primary: #E50914;
            --text-main: #ffffff;
            --text-muted: #9aa0a6;
            --accent-green: #28a745;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }

        .brand-title { color: var(--primary); font-size: 1.8rem; font-weight: 800; }
        .nav-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .user-info { font-size: 0.85rem; color: var(--text-muted); margin-right: 8px; }

        .btn-tab {
            padding: 10px 18px; border-radius: 20px; background: transparent;
            border: 1px solid var(--border-color); color: #fff; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-tab.active { background: var(--primary); border-color: var(--primary); }

        .btn { padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; color: #fff; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-green { background: var(--accent-green); }
        .btn-logout { background: #333; }
        .btn-danger { background: #dc3545; padding: 6px 12px; font-size: 0.8rem; }

        .container { padding: 32px; }

        .categories-bar {
            display: flex; gap: 15px; margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 12px; overflow-x: auto;
        }

        .cat-item { color: var(--text-muted); cursor: pointer; font-size: 0.95rem; font-weight: 600; white-space: nowrap; }
        .cat-item:hover, .cat-item.active { color: #fff; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }

        .grid-cards {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px;
        }

        .item-card {
            background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color);
            overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
            display: flex; flex-direction: column; justify-content: space-between; position: relative;
        }
        .item-card:hover { transform: translateY(-4px); border-color: var(--primary); }
        .item-card img { width: 100%; height: 240px; object-fit: cover; background: #101114; }
        .item-info { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
        .item-title { font-weight: 700; font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-type { color: var(--primary); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }

        .admin-section {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 24px; margin-bottom: 32px; display: none;
        }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .admin-stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 16px 24px; border-radius: 8px; flex: 1; min-width: 180px;
        }
        .stat-card span { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .stat-card h3 { font-size: 1.8rem; color: var(--primary); margin-top: 5px; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        th { background: #000; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
        tr:hover { background: var(--card-bg); }

        .badge-role { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-admin { background: rgba(229, 9, 20, 0.2); color: var(--primary); border: 1px solid var(--primary); }
        .badge-user { background: rgba(40, 167, 69, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 24px; width: 100%; max-width: 400px;
        }
        .modal-card input, .modal-card select {
            width: 100%; padding: 12px; margin-bottom: 12px;
            background: #000; border: 1px solid var(--border-color);
            color: #fff; border-radius: 6px; outline: none;
        }

        .player-modal {
            background: #000; border: 1px solid var(--border-color);
            border-radius: 12px; width: 90%; max-width: 900px; overflow: hidden;
        }
        .player-header { padding: 16px; background: var(--bg-secondary); display: flex; justify-content: space-between; align-items: center; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>

        document.addEventListener("DOMContentLoaded", function() {
            const username = localStorage.getItem("kaduflix_user") || "Usuário";
            const userRole = localStorage.getItem("kaduflix_role") || "user";

            document.getElementById("sessionUserName").innerText = username;
            document.getElementById("sessionRole").innerText = userRole === "admin" ? "Admin" : "Comum";

            if (userRole === "admin") {
                document.getElementById("btnAdminTab").style.display = "inline-block";
                fetchSheetDBUsers();
                refreshUsersInterval = setInterval(fetchSheetDBUsers, 30000);
            }

            renderGrid('canais', 'todos');
        });

        function switchMainTab(tab, btnEl) {
            currentTab = tab;
            const buttons = document.querySelectorAll('.nav-actions .btn-tab');
            buttons.forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            const adminPanel = document.getElementById('adminPanel');
            const subCategoryBar = document.getElementById('subCategoryBar');
            const contentGrid = document.getElementById('contentGrid');

            if (tab === 'admin') {
                adminPanel.style.display = 'block';
                subCategoryBar.style.display = 'none';
                contentGrid.style.display = 'none';
                fetchSheetDBUsers();
            } else {
                adminPanel.style.display = 'none';
                subCategoryBar.style.display = 'flex';
                contentGrid.style.display = 'grid';
                renderGrid(tab, 'todos');
            }
        }

        async function fetchSheetDBUsers() {
            try {
                const response = await fetch(SHEETDB_URL);
                if (!response.ok) return;
                const users = await response.json();

                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';

                let adminCount = 0;
                let userCount = 0;

                users.forEach(user => {
                    const isAdm = (user.CARGO || '').toLowerCase() === 'admin';
                    if (isAdm) adminCount++; else userCount++;

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${user.USUARIO}</strong></td>
                            <td><span class="badge-role ${isAdm ? 'badge-admin' : 'badge-user'}">${user.CARGO || 'user'}</span></td>
                            <td>${user.DATA_DE_CRIACAO || '-'}</td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteUser('${user.USUARIO}')">Excluir</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('statTotalUsers').innerText = users.length;
                document.getElementById('statAdminUsers').innerText = adminCount;
                document.getElementById('statCommonUsers').innerText = userCount;
            } catch (err) {
                console.error("Erro ao buscar usuários do SheetDB:", err);
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Tem certeza que deseja excluir o usuário "${username}"?`)) return;

            try {
                const response = await fetch(`${SHEETDB_URL}/USUARIO/${username}`, {
                    method: 'DELETE',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    alert(`Usuário "${username}" removido.`);
                    fetchSheetDBUsers();
                } else {
                    alert("Erro ao remover usuário.");
                }
            } catch (err) {
                alert("Falha na comunicação com a API.");
            }
        }

        async function fetchTmdbPoster(tab, id, title) {
            const type = tab === 'filmes' ? 'movie' : 'tv';
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_API_KEY}&language=pt-BR`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.poster_path) return TMDB_IMG_BASE + data.poster_path;
                }
            } catch (e) {
                console.error("Erro ao carregar TMDB:", e);
            }
            return `https://via.placeholder.com/300x450/1c1d22/ffffff?text=${encodeURIComponent(title)}`;
        }

        async function renderGrid(tab, subCat) {
            const grid = document.getElementById('contentGrid');
            const catBar = document.getElementById('subCategoryBar');
            grid.innerHTML = '';
            catBar.innerHTML = '';

            if (tab === 'canais') {
                const categories = ['todos', 'Esporte', 'Filmes', 'Infantis', 'Noticias', 'Abertos'];
                categories.forEach(c => {
                    catBar.innerHTML += `<span class="cat-item ${c === subCat ? 'active' : ''}" onclick="renderGrid('canais', '${c}')">${c.toUpperCase()}</span>`;
                });

                catalog.canais.forEach(item => {
                    if (subCat === 'todos' || item.cat === subCat) {
                        grid.innerHTML += `
                            <div class="item-card" onclick="playStream('${item.name.replace(/'/g, "\\'")}', '${item.url}')">
                                <img src="${item.icon}" style="padding: 25px; object-fit: contain;">
                                <div class="item-info">
                                    <span class="item-title">${item.name}</span>
                                    <span class="item-type">${item.cat.toUpperCase()}</span>
                                </div>
                            </div>`;
                    }
                });
            } else {
                const list = catalog[tab] || [];

                let embedType = 'filme';
                if (tab === 'series') embedType = 'serie';
                if (tab === 'animes') embedType = 'anime';

                for (let item of list) {
                    const embedUrl = `https://superflixapi.beer/${embedType}/${item.id}`;
                    const cardId = `card-img-${item.id}`;

                    grid.innerHTML += `
                        <div class="item-card" onclick="playStream('${item.name.replace(/'/g, "\\'")}', '${embedUrl}')">
                            <img id="${cardId}" src="https://via.placeholder.com/300x450/1c1d22/ffffff?text=Carregando..." alt="${item.name}">
                            <div class="item-info">
                                <span class="item-title">${item.name}</span>
                                <span class="item-type">${tab.toUpperCase()}</span>
                            </div>
                        </div>`;

                    fetchTmdbPoster(tab, item.id, item.name).then(posterUrl => {
                        const imgEl = document.getElementById(cardId);
                        if (imgEl) imgEl.src = posterUrl;
                    });
                }
            }
        }

        function playStream(title, source) {
            document.getElementById('playerTitle').innerText = title;
            const container = document.getElementById('playerContainer');
            document.getElementById('playerModal').classList.add('active');
            container.innerHTML = `<iframe src="${source}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        }

        function closePlayerModal() {
            document.getElementById('playerContainer').innerHTML = '';
            document.getElementById('playerModal').classList.remove('active');
        }

        function openCreateUserModal() { document.getElementById('createUserModal').classList.add('active'); }
        function closeCreateUserModal() { 
            document.getElementById('createUserModal').classList.remove('active');
            document.getElementById('createUserForm').reset();
        }

        document.getElementById('createUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btnSaveUser = document.getElementById('btnSaveUser');
            const usuario = document.getElementById('newUsername').value.trim();
            const senha = document.getElementById('newPassword').value.trim();
            const cargo = document.getElementById('newRole').value;
            const dataCriacao = new Date().toISOString().replace('T', ' ').substring(0, 10);

            btnSaveUser.innerText = "Salvando...";
            btnSaveUser.disabled = true;

            try {
                const response = await fetch(SHEETDB_URL, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        data: [{ 'USUARIO': usuario, 'SENHA': senha, 'CARGO': cargo, 'DATA_DE_CRIACAO': dataCriacao }]
                    })
                });

                if (response.ok) {
                    alert(`Usuário "${usuario}" cadastrado com sucesso!`);
                    closeCreateUserModal();
                    fetchSheetDBUsers();
                } else {
                    alert("Erro ao cadastrar usuário.");
                }
            } catch (err) {
                alert("Erro ao comunicar com a planilha.");
            } finally {
                btnSaveUser.innerText = "Cadastrar";
                btnSaveUser.disabled = false;
            }
        });
    </script>

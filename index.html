<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - KaduFLIX</title>
    <link rel="shortcut icon" href="#">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="auth-guard.js"></script>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #16181c;
            --border-color: #2f3336;
            --primary: #E50914;
            --primary-hover: #881D24;
            --text-main: #e7e9ea;
            --text-muted: #71767b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .brand-title {
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .error-message {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="brand-title">KADUFLIX</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="usernameInput">Usuário</label>
                <input type="text" id="usernameInput" required placeholder="Digite seu usuário">
            </div>
            <div class="form-group">
                <label for="passwordInput">Senha</label>
                <input type="password" id="passwordInput" required placeholder="Digite sua senha">
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">Entrar</button>
            <div class="error-message" id="errorMsg">Usuário ou senha incorretos!</div>
        </form>
    </div>

    <script>

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const inputUser = document.getElementById('username').value.trim();
    const inputPass = document.getElementById('password').value.trim();
    const btnSubmit = document.querySelector('button[type="submit"]');

    btnSubmit.innerText = "Entrando...";
    btnSubmit.disabled = true;

    try {
        // Busca os usuários cadastrados na API correta do SheetDB
        const response = await fetch("https://sheetdb.io/api/v1/hwd4ldwfwnxs9");
        if (!response.ok) throw new Error("Erro na requisição da API");

        const data = await response.json();

        // Procura pelo usuário ignorando diferença entre maiúsculas/minúsculas
        const account = data.find(u => 
            String(u.USUARIO).trim().toLowerCase() === inputUser.toLowerCase() && 
            String(u.SENHA).trim() === inputPass
        );

        if (account) {
            // Salva os dados na sessão local
            localStorage.setItem("kaduflix_user", account.USUARIO);
            localStorage.setItem("kaduflix_role", (account.CARGO || "user").toLowerCase());

            // Redireciona para o painel principal
            window.location.href = "dashboard.html";
        } else {
            alert("Usuário ou senha incorretos!");
        }
    } catch (error) {
        console.error("Erro no login:", error);
        alert("Falha ao se conectar com a base de dados. Verifique sua conexão ou a API do SheetDB.");
    } finally {
        btnSubmit.innerText = "Entrar";
        btnSubmit.disabled = false;
    }
});
    </script>
</body>
</html>

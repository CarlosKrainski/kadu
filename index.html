<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaduFLIX - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Autenticação preventiva -->
    <script src="auth-guard.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body {
            background-color: #0b0c0e;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: #141519;
            border: 1px solid #2a2b30;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .brand-title {
            color: #E50914;
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #9aa0a6; }
        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #2a2b30;
            color: #fff;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }
        input:focus { border-color: #E50914; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #E50914;
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { background: #555; cursor: not-allowed; }
        .error-msg {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-title">KADUFLIX</div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="Digite seu usuário" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-submit" id="btnLogin">Entrar</button>
            <div class="error-msg" id="errorMsg">Usuário ou senha incorretos!</div>
        </form>
    </div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/hwd4ldwfwnxs9";

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const inputUser = document.getElementById('username').value.trim();
            const inputPass = document.getElementById('password').value.trim();
            const btnLogin = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';
            btnLogin.innerText = "Verificando...";
            btnLogin.disabled = true;

            try {
                // Consulta a API do SheetDB
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error("Erro de conexão com o servidor");
                }

                const users = await response.json();

                // Busca credenciais na lista
                const account = users.find(u => {
                    const dbUser = String(u.USUARIO || '').trim().toLowerCase();
                    const dbPass = String(u.SENHA || '').trim();
                    return dbUser === inputUser.toLowerCase() && dbPass === inputPass;
                });

                if (account) {
                    // Armazena a sessão
                    localStorage.setItem("kaduflix_user", account.USUARIO);
                    localStorage.setItem("kaduflix_role", String(account.CARGO || 'user').toLowerCase());

                    // Redireciona para o Dashboard
                    window.location.href = "dashboard.html";
                } else {
                    errorMsg.innerText = "Usuário ou senha incorretos!";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error("Erro no login:", err);
                errorMsg.innerText = "Falha ao conectar com o banco de dados.";
                errorMsg.style.display = 'block';
            } finally {
                btnLogin.innerText = "Entrar";
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
